<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JEV Feasibility</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body>
    <main>
      <h1>Zeta × JEV</h1>
      <label class="toggle"><input id="enabled" type="checkbox"><span>Feasibility 측정 활성화</span></label>
      <div id="connection">확장 연결 상태를 확인하는 중…</div>
      <div id="summary">기록을 불러오는 중…</div>
      <div class="buttons">
        <button id="download">로그 JSON 저장</button>
        <button id="clear" class="secondary">로그 비우기</button>
      </div>
      <button id="options" class="link">API 및 측정 설정</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
