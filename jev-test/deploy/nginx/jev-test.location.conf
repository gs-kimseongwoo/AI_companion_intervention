# Add these blocks inside the existing port-80 server block in
# /etc/nginx/sites-available/default.

location = /jev-test {
    return 301 /jev-test/;
}

location /jev-test/ {
    # KAIST address space. Basic Auth remains required within this network.
    allow 143.248.0.0/16;
    deny all;

    auth_basic "Jev PIPPA Research";
    auth_basic_user_file /etc/nginx/.htpasswd-jev-test;

    alias /mnt/sting/jeongwon/jev-test/;
    index index.html;
}
